[project]
name = "handgen"
version = "0.1.0"
description = "Render local handwriting samples, model-generated prose and worksheet math to paginated SVG and PNG."
readme = "README.md"
authors = [
  { name = "Arnav Kulkarni" },
  { name = "Felix Tuchscherer" },
]
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pillow>=10",
]

[project.optional-dependencies]
vatr = ["torch>=2", "torchvision>=0.14", "safetensors>=0.4"]
vision = ["pyobjc-framework-Vision>=10; sys_platform == 'darwin'"]
test = [
  "pytest>=8",
]
diffbrush = [
  "accelerate>=1",
  "diffusers>=0.29",
  "easydict>=1.13",
  "einops>=0.8",
  "lmdb>=1.6",
  "omegaconf>=2.3",
  "opencv-python>=4.10",
  "pyyaml>=6",
  "scikit-image>=0.21",
  "scikit-learn>=1.3",
  "scipy>=1.10",
  "six>=1.17",
  "tensorboardX>=2.6",
  "timm>=1",
  "torch>=2",
  "torchvision>=0.14",
  "transformers>=4.46",
]

[project.scripts]
handgen = "handgen.cli:main"

[project.urls]
Repository = "https://github.com/navkul/handgen"
Documentation = "https://github.com/navkul/handgen/blob/main/docs/pipeline.md"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["handgen*"]
